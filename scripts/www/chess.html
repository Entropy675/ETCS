<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ACE Chess</title>
<!-- /chess.html moved. A link to a server-played match (?room=) goes on to
     /chess-classic, where that page now lives; anything else to the lobby
     list at /chess/. Script rather than a refresh tag so the query survives. -->
<script>
  const q = location.search;
  location.replace(/[?&]room=/.test(q) ? '/chess-classic' + q : '/chess/');
</script>
</head>
<body style="background:#14150f;color:#e8e2d5;font:14px ui-monospace,monospace">
  <p>Moved: <a href="/chess/" style="color:#c9b458">/chess/</a></p>
</body>
</html>
